[package]
name = "nighthawk-app-desktop"
version = "3.1.7"
description = "Nighthawk Desktop — DarkFi wallet with Lit UI"
authors = ["Nighthawk Apps"]
edition = "2024"

[lib]
name = "nighthawk_app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-shell = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
dirs = "6"
keyring = { version = "3", features = ["apple-native", "linux-native", "windows-native"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
hex = "0.4"
bs58 = "0.5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Cap at 1.8.3: nym-crypto (via nym-smolmix) requires blake3 < 1.8.4.
blake3 = "=1.8.3"
argon2 = "0.5"
url = "2"

# Same UniFFI crate as the Android wallet. Path is the real tree, not a
# symlink: Cargo resolves `third_party/darkfi` relative to the crate directory.
# UniFFI 0.32.2 = crates.io latest (aligned with Android FFI).
darkfi-mobile-ffi = { path = "../../nighthawk-android-wallet/rust/darkfi-mobile-ffi", default-features = true }
async-stream = "0.3.6"

[patch.crates-io]
halo2_proofs = { git = "https://github.com/parazyd/halo2", branch = "v050" }
halo2_gadgets = { git = "https://github.com/parazyd/halo2", branch = "v050" }
url = { git = "https://github.com/darkrenaissance/rust-url", branch = "v258" }
# Same pins as nighthawk-android-wallet/rust/Cargo.toml: darkfi-mobile-ffi needs
# nym-smolmix 2.0.0, which is not on crates.io, and one form_urlencoded.
form_urlencoded = { git = "https://github.com/darkrenaissance/rust-url", branch = "v258" }
nym-smolmix = { git = "https://github.com/nymtech/nym.git", rev = "5f0dba82d7a4c3d32fb21f78a0e3ddb6320b4ae8" }
