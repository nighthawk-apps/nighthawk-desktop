name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: TypeScript, Unit Tests, and Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust Unit Tests and Fetch Script Syntax
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/fetch-xmrig.sh
      - run: cargo test --manifest-path src-tauri/Cargo.toml

