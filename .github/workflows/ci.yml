name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    name: TypeScript, Unit Tests, and Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Rust Unit Tests and Fetch Script Syntax
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Android wallet for darkfi-mobile-ffi
        uses: actions/checkout@v4
        with:
          repository: nighthawk-apps/nighthawk-android-wallet
          # Main CI tracks nighthawk-dark on purpose, while release.yml is pinned.
          ref: nighthawk-dark
          path: android-wallet
          submodules: recursive
      - name: Link the FFI crate where Cargo.toml expects it
        run: ln -sfn "$GITHUB_WORKSPACE/android-wallet" "$(dirname "$GITHUB_WORKSPACE")/nighthawk-android-wallet"
      - run: bash -n scripts/fetch-xmrig.sh
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --no-deps -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

