name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux (ubuntu-22.04)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Blackhawk UniFFI core
        uses: actions/checkout@v4
        with:
          repository: nighthawk-apps/blackhawk
          # Pinned Blackhawk commit this desktop release builds against.
          ref: cd8971c8c770f89a5978d76c8ee049e61e7d092f
          path: blackhawk
          submodules: recursive
      - name: Link the FFI crate where Cargo.toml expects it
        run: ln -sfn "$GITHUB_WORKSPACE/blackhawk" "$(dirname "$GITHUB_WORKSPACE")/blackhawk"
      - name: Install Linux Tauri and audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsecret-1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            rpm \
            squashfs-tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile DarkFi event_graph .zk.bin proofs
        run: |
          cd blackhawk/third_party/darkfi
          cargo build --release -p zkas
          for zk in src/event_graph/proof/*.zk; do
            ./target/release/zkas "$zk" -o "${zk}.bin"
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify xmrig sidecar is executable
        run: chmod +x src-tauri/binaries/xmrig-x86_64-unknown-linux-gnu
      - name: Build .deb, .rpm, and .AppImage bundles
        env:
          CI: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: pnpm tauri build --bundles deb,rpm,appimage
      - name: Package portable tar.gz and collect Linux artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          OUT="$RUNNER_TEMP/release-linux"
          STAGE="$RUNNER_TEMP/stage-linux/nighthawk-${VERSION}-linux-x86_64"
          mkdir -p "$OUT" "$STAGE"

          cp src-tauri/target/release/nighthawk-app-desktop "$STAGE/"
          cp src-tauri/binaries/xmrig-x86_64-unknown-linux-gnu "$STAGE/xmrig"
          chmod +x "$STAGE/nighthawk-app-desktop" "$STAGE/xmrig"
          tar -C "$RUNNER_TEMP/stage-linux" -czf "$OUT/Nighthawk_${VERSION}_linux_x86_64.tar.gz" "nighthawk-${VERSION}-linux-x86_64"

          find src-tauri/target/release/bundle/deb -maxdepth 2 -name "*.deb" -exec cp {} "$OUT/" \;
          find src-tauri/target/release/bundle/rpm -maxdepth 2 -name "*.rpm" -exec cp {} "$OUT/" \;
          find src-tauri/target/release/bundle/appimage -maxdepth 2 -name "*.AppImage" -exec cp {} "$OUT/" \;
          test -n "$(find "$OUT" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find "$OUT" -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$(find "$OUT" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -f "$OUT/Nighthawk_${VERSION}_linux_x86_64.tar.gz"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: ${{ runner.temp }}/release-linux/*

  build-macos:
    name: Build macOS (aarch64 + universal)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Blackhawk UniFFI core
        uses: actions/checkout@v4
        with:
          repository: nighthawk-apps/blackhawk
          # Pinned Blackhawk commit this desktop release builds against.
          ref: cd8971c8c770f89a5978d76c8ee049e61e7d092f
          path: blackhawk
          submodules: recursive
      - name: Link the FFI crate where Cargo.toml expects it
        run: ln -sfn "$GITHUB_WORKSPACE/blackhawk" "$(dirname "$GITHUB_WORKSPACE")/blackhawk"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Compile DarkFi event_graph .zk.bin proofs
        run: |
          cd blackhawk/third_party/darkfi
          cargo build --release -p zkas
          for zk in src/event_graph/proof/*.zk; do
            ./target/release/zkas "$zk" -o "${zk}.bin"
          done
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare universal xmrig Mach-O sidecar
        run: |
          chmod +x src-tauri/binaries/xmrig-aarch64-apple-darwin src-tauri/binaries/xmrig-x86_64-apple-darwin
          lipo -create \
            src-tauri/binaries/xmrig-aarch64-apple-darwin \
            src-tauri/binaries/xmrig-x86_64-apple-darwin \
            -output src-tauri/binaries/xmrig-universal-apple-darwin
          chmod +x src-tauri/binaries/xmrig-universal-apple-darwin
          lipo -info src-tauri/binaries/xmrig-universal-apple-darwin
          shasum -a 256 src-tauri/binaries/xmrig-universal-apple-darwin
      - name: Build macOS Apple Silicon (.dmg)
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target aarch64-apple-darwin --bundles dmg
      - name: Build macOS Universal (.dmg)
        env:
          CI: "true"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - name: Collect macOS artifacts
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          OUT="$RUNNER_TEMP/release-macos"
          mkdir -p "$OUT"
          AARCH64_DMG="$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 2 -name '*.dmg' | head -n 1)"
          UNIVERSAL_DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 2 -name '*.dmg' | head -n 1)"
          test -n "$AARCH64_DMG" && test -n "$UNIVERSAL_DMG"
          cp "$AARCH64_DMG" "$OUT/Nighthawk_${VERSION}_aarch64.dmg"
          cp "$UNIVERSAL_DMG" "$OUT/Nighthawk_${VERSION}_universal.dmg"
          ls -lh "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: ${{ runner.temp }}/release-macos/*

  build-windows:
    name: Build Windows (x64 MSVC)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Blackhawk UniFFI core
        uses: actions/checkout@v4
        with:
          repository: nighthawk-apps/blackhawk
          # Pinned Blackhawk commit this desktop release builds against.
          ref: cd8971c8c770f89a5978d76c8ee049e61e7d092f
          path: blackhawk
          submodules: recursive
      - name: Link the FFI crate where Cargo.toml expects it
        shell: pwsh
        run: |
          $parent = Split-Path -Parent $env:GITHUB_WORKSPACE
          $link = Join-Path $parent "blackhawk"
          $target = Join-Path $env:GITHUB_WORKSPACE "blackhawk"
          if (Test-Path $link) { Remove-Item $link -Force -Recurse }
          New-Item -ItemType Junction -Path $link -Target $target | Out-Null
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Compile DarkFi event_graph .zk.bin proofs
        shell: pwsh
        run: |
          Push-Location blackhawk/third_party/darkfi
          try {
            cargo build --release -p zkas
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Get-ChildItem -Path "src/event_graph/proof" -Filter "*.zk" | ForEach-Object {
              & ".\target\release\zkas.exe" $_.FullName -o ($_.FullName + ".bin")
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally {
            Pop-Location
          }
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Windows NSIS (.exe) installer
        env:
          CI: "true"
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Package portable zip and collect Windows artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $out = Join-Path $env:RUNNER_TEMP "release-windows"
          $stage = Join-Path $env:RUNNER_TEMP "stage-windows"
          New-Item -ItemType Directory -Force -Path $out, $stage | Out-Null

          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/nighthawk-app-desktop.exe" (Join-Path $stage "Nighthawk.exe")
          Copy-Item "src-tauri/binaries/xmrig-x86_64-pc-windows-msvc.exe" (Join-Path $stage "xmrig.exe")
          Compress-Archive -Path "$stage\*" -DestinationPath (Join-Path $out "Nighthawk_${version}_windows_x64_portable.zip") -Force

          $nsisExe = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $nsisExe) { throw "Missing Windows NSIS .exe bundle" }
          Copy-Item $nsisExe.FullName (Join-Path $out "Nighthawk_${version}_x64.exe")
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: ${{ runner.temp }}/release-windows/*

  release:
    name: Create Draft Release & SHA256SUMS
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd dist-artifacts
          rm -f SHA256SUMS.txt
          LC_ALL=C sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload checksummed release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: nighthawk-desktop-release-bundle
          path: dist-artifacts/*
      - name: Upload draft GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist-artifacts/*
